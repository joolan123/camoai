<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Gateway Services</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 48px 20px; display: flex; justify-content: center; }
    .container { max-width: 640px; width: 100%; }
    .badge { display: inline-block; background: #10b981; color: white; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 700; margin: 0 0 12px 0; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin: 0 0 24px 0; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; }
    .code { font-family: monospace; color: #38bdf8; font-size: 13px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Healthy</div>
    <h1>Edge Telemetry Relay</h1>
    <p>Operational synchronization microservice. Ingress load balancers are routing live data streams to primary workers.</p>
    <div class="card">
      <div class="code">GET /health &rarr; 200 OK</div>
    </div>
  </div>
</body>
</html>
